services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: delivery
      POSTGRES_PASSWORD: delivery
      POSTGRES_DB: delivery_app_backend
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U delivery -d delivery_app_backend']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://delivery:delivery@postgres:5432/delivery_app_backend?schema=public
      LOG_LEVEL: info
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173
      TRUST_PROXY: 'false'
    command: ['sh', '-c', 'npm run db:deploy && node dist/server.js']
    ports:
      - '4000:4000'
    depends_on:
      postgres:
        condition: service_healthy
    init: true
    restart: unless-stopped

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    ports:
      - '3000:80'
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres_data:
